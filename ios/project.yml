name: MTRLiftGuide

options:
  bundleIdPrefix: hk.isdn.mtrliftguide
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.9"
  ENABLE_PREVIEWS: YES
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1"

targets:
  MTRLiftGuide:
    type: application
    platform: iOS
    sources:
      - path: MTRLiftGuide
      - path: Shared
    resources:
      - path: MTRLiftGuide/Resources/stations.json
        buildPhase: resources
      - path: MTRLiftGuide/Resources/official_maps.json
        buildPhase: resources
    dependencies:
      - target: MTRLiftGuideWidget
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: hk.isdn.mtrliftguide
      PRODUCT_NAME: MTR Lift Guide
      DEVELOPMENT_TEAM: 47LR4272KS
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_UILaunchScreenType: ""
      INFOPLIST_KEY_NSSupportsLiveActivities: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "Shows the live camera view behind the exit directions. 用於顯示出口指示的即時相機畫面。"
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used for compass direction only so the arrow can point you to the correct exit. 僅用於指南針方向，讓箭頭指向正確出口。"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      SUPPORTS_MACCATALYST: NO
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      TARGETED_DEVICE_FAMILY: "1"
      EXCLUDED_ARCHS[sdk=iphonesimulator*]: ""
      SWIFT_EMIT_LOC_STRINGS: YES
    postcompileScripts: []

  MTRLiftGuideWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MTRLiftGuideWidget
      - path: Shared
    info:
      path: MTRLiftGuideWidget/Info.plist
      properties:
        CFBundleDisplayName: MTR Lift Guide
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: hk.isdn.mtrliftguide.widget
      PRODUCT_NAME: MTR Lift Guide Widget
      DEVELOPMENT_TEAM: 47LR4272KS
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: YES
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      TARGETED_DEVICE_FAMILY: "1"
    postcompileScripts: []

  MTRLiftGuideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MTRLiftGuide
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: hk.isdn.mtrliftguide.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: MTRLiftGuide

schemes:
  MTRLiftGuide:
    build:
      targets:
        MTRLiftGuide: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MTRLiftGuideUITests
